version: "3.8"

# ============================================================================
# Soma — docker-compose.test.yml
# Ephemeral test environment for CLI integration testing.
# Usage: docker compose -f docker-compose.test.yml up -d
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: soma_prod
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  soma:
    build: .
    ports:
      - "4084:4084"
    environment:
      DATABASE_URL: "ecto://postgres:postgres_secure_password@postgres:5432/soma_prod"
      THALAMUS_URL: "http://thalamus:4000"
      PORT: "4084"
      SECRET_KEY_BASE: "test-secret-key-base-not-for-production-use-64bytes-minimum!!"
      MIX_ENV: prod
      HOME: /app
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - soma-tmp:/app/tmp
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  soma-tmp:
