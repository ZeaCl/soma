# ── Imagen ──────────────────────────────────────
image:
  repository: soma
  tag: latest
  pullPolicy: IfNotPresent

# ── Recursos ────────────────────────────────────
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

# ── Ingress ─────────────────────────────────────
ingress:
  enabled: true
  host: soma.k8s.local
  tls:
    enabled: false

# ── Servicio ────────────────────────────────────
service:
  type: ClusterIP
  port: 4084

# ── Health checks ───────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: 4084
readinessProbe:
  httpGet:
    path: /health
    port: 4084

# ── Entorno ─────────────────────────────────────
env:
  phxHost: soma.zea.localhost
